name: macOS release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload, for example v0.4.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: macOS ${{ matrix.arch }} DMG
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
          - arch: x64
            target: x86_64-apple-darwin
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install pinned Tauri CLI
        run: cargo install tauri-cli --version 2.12.3 --locked
      - name: Verify release tag matches bundle version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          config_version="$(node -p 'require("./desktop/src-tauri/tauri.conf.json").version')"
          if [[ "$RELEASE_TAG" != "v$config_version" ]]; then
            printf 'Release tag %s does not match bundle version %s\n' "$RELEASE_TAG" "$config_version" >&2
            exit 1
          fi
      - name: Build and verify DMG
        run: bash scripts/package-mac.sh "${{ matrix.target }}"
      - name: Create draft release if needed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          tag="$RELEASE_TAG"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --notes "" || gh release view "$tag"
          fi
      - name: Upload DMG
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          ARTIFACT_ARCH: ${{ matrix.arch }}
        run: |
          version="${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" "AgentOffice_${version}_${ARTIFACT_ARCH}.dmg" --clobber
