<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Activity preview</title>
<style>html,body{margin:0;height:100%;background:#F3F6F7}#host{width:100%;height:100%}</style></head>
<body><div id="host"></div>
<script src="/vendor/pixi.min.js"></script>
<script type="module">
import { drawOffice, drawNamePlate } from '/office-art.js';
import { drawActor, drawEmote, ACTIVITIES } from '/office-activity.js';
import { iso, depthOf, createSeatAllocator } from '/floor-plan.js';
const PIXI = window.PIXI;
const host = document.querySelector('#host');
const app = new PIXI.Application();
await app.init({ resizeTo: host, antialias: true, backgroundColor: 0xF3F6F7, resolution: 2, autoDensity: true });
host.append(app.canvas);
const mode = new URLSearchParams(location.search).get('mode') ?? 'office';
const COLORS = { claude: 0xD97757, codex: 0x10A37F, gemini: 0x4285F4 };
const actors = [];
const T = 1234;
if (mode === 'sheet') {
  const kinds = ['read','code','run','search','plan','reply','think','rest','walk','deliver'];
  const where = { read:'자료실', code:'개발실', run:'서버실', search:'정보검색실', plan:'회의실', reply:'응답 데스크', think:'어디서든', rest:'라운지', walk:'복도', deliver:'우편함→엘리베이터' };
  const title = new PIXI.Text({ text: '활동 그림 언어', style: { fontFamily: 'Noto Sans CJK KR, sans-serif', fontSize: 22, fontWeight: '800', fill: 0x334155 } });
  title.position.set(30, 20); app.stage.addChild(title);
  kinds.forEach((k, i) => {
    const col = i % 6, row = Math.floor(i / 6);
    const x = 95 + col * 175, y = 230 + row * 250;
    const card = new PIXI.Graphics().roundRect(x - 78, y - 160, 156, 225, 16).fill(0xFFFFFF).stroke({ color: 0xE2E8F0, width: 1 });
    app.stage.addChild(card);
    const a = drawActor(PIXI, { color: [COLORS.claude, COLORS.codex, COLORS.gemini][i % 3], seed: i, activity: k });
    a.scale.set(1.5); a.position.set(x, y - 10); a.tick(T, k === 'walk' || k === 'deliver');
    const e = drawEmote(PIXI, k); e.scale.set(1.5); e.position.set(x + 8, y - 10 + a.emoteAnchorY * 1.5 - 8); e.tick(T);
    const l = new PIXI.Text({ text: ACTIVITIES[k].label, style: { fontFamily: 'Noto Sans CJK KR, sans-serif', fontSize: 15, fontWeight: '700', fill: 0x334155 } });
    l.anchor.set(0.5); l.position.set(x, y + 22);
    const w = new PIXI.Text({ text: where[k], style: { fontFamily: 'Noto Sans CJK KR, sans-serif', fontSize: 12, fill: 0x94A3B8 } });
    w.anchor.set(0.5); w.position.set(x, y + 44);
    app.stage.addChild(a, e, l, w);
  });
} else {
  const office = drawOffice(PIXI);
  const world = new PIXI.Container(); world.addChild(office.root); app.stage.addChild(world);
  const icons = { claude: await PIXI.Assets.load('/assets/icons/anthropic.svg'), codex: await PIXI.Assets.load('/assets/icons/openai.svg'), gemini: await PIXI.Assets.load('/assets/icons/googlegemini.svg') };
  const NAMES = { claude: 'Claude Code', codex: 'Codex', gemini: 'Antigravity' };
  const seats = createSeatAllocator();
  const people = [
    ['gemini','library','read'], ['claude','dev','code'], ['codex','server','run'], ['codex','search','search'],
    ['claude','meeting','plan'], ['gemini','desk','reply'], ['codex','dev','think'], ['claude','lounge','rest']
  ];
  const top = new PIXI.Container();
  people.forEach(([src, room, kind], i) => {
    const p = seats.assign(`a${i}`, room);
    const pos = iso(p.x, p.y);
    const a = drawActor(PIXI, { color: COLORS[src], seed: i, activity: kind });
    a.position.set(pos.x, pos.y); a.zIndex = depthOf(p.x, p.y) + 1; a.tick(T);
    office.objects.addChild(a);
    const e = drawEmote(PIXI, kind); e.position.set(pos.x + 2, pos.y + a.emoteAnchorY); e.tick(T);
    top.addChild(e);
    if (['code','think'].includes(kind)) {
      const plate = drawNamePlate(PIXI, { text: NAMES[src], color: COLORS[src], icon: icons[src] });
      plate.position.set(pos.x, pos.y + a.emoteAnchorY - (kind === 'think' ? 44 : 34));
      top.addChild(plate);
    }
  });
  office.root.addChild(top);
  const b = office.bounds, w = b.maxX - b.minX, h = b.maxY - b.minY;
  const s = Math.min(host.clientWidth * 0.94 / w, host.clientHeight * 0.94 / h);
  world.scale.set(s);
  world.position.set((host.clientWidth - w * s) / 2 - b.minX * s, (host.clientHeight - h * s) / 2 - b.minY * s);
}
window.ready = true;
</script></body></html>
